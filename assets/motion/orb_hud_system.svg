<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 740" width="1400" height="740" role="img"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".54" stop-color="#F5FAFF"/><stop offset="1" stop-color="#E8F4FF"/></linearGradient>
<linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A73E8"/><stop offset=".56" stop-color="#57C4F7"/><stop offset="1" stop-color="#F27A28"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white" stop-opacity=".97"/><stop offset="1" stop-color="#F1F8FF" stop-opacity=".91"/></linearGradient>
<filter id="shadow" x="-25%" y="-40%" width="160%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#2F689B" flood-opacity=".14"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="mesh" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#C8DBEE" stroke-width=".7" opacity=".5"/></pattern>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif} .navy{fill:#102F56}.muted{fill:#52749C}.blue{fill:#0A73E8}.orange{fill:#F27A28}.small{font-size:19px}.tiny{font-size:15px} .caps{letter-spacing:3px;font-weight:700;font-size:16px} .pulse{transform-origin:center;animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:center;animation:rotate 22s linear infinite}.dash{stroke-dasharray:8 16;animation:dash 20s linear infinite}.flow{stroke-dasharray:8 12;animation:dash 8s linear infinite}@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-320}}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.dash,.flow{animation:none!important}}</style>
</defs><rect width="1400" height="740" fill="url(#bg)"/><rect width="1400" height="740" fill="url(#mesh)" opacity=".45"/><text x="65" y="96" font-size="39" font-weight="700" fill="#102F56" >XMECK-AI  /  INTELLIGENCE CONTROL</text><text x="65" y="139" font-size="22" font-weight="400" fill="#153C69" >Model readiness, user context and explicit control in a single workspace.</text><g transform="translate(700,381)"><circle r="209.1" fill="#C7ECFF" opacity=".4" class="pulse"/><circle r="170" fill="white" stroke="#B5D9F5" stroke-width="3"/><circle r="141.1" fill="none" stroke="url(#orb)" stroke-width="9" stroke-dasharray="360 38" class="orbit"/><circle r="102.0" fill="#F2F9FF" stroke="#DBEAFA" stroke-width="2"/><path d="M-47.6 -51.0 L-5.1 -51.0 L49.3 51.0 L6.8 51.0Z" fill="#0A73E8"/><path d="M47.6 -51.0 L6.8 -51.0 L-49.3 51.0 L-6.8 51.0Z" fill="#F27A28"/><circle r="8" fill="white"/><ellipse rx="190.4" ry="64.6" fill="none" stroke="#0A73E8" stroke-width="2.3" transform="rotate(-30)" class="orbit"/><circle cx="161.5" cy="-27.2" r="9" fill="#F27A28" class="pulse"/></g><rect x="70" y="245" width="350" height="130" rx="24" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><rect x="87" y="268" width="5" height="77" rx="2" fill="#0A73E8"/><text x="108" y="303" font-size="22" font-weight="700" fill="#102F56" >MODEL ROUTE</text><text x="108" y="338" font-size="17" font-weight="400" fill="#5E7D9C" >Qualified local or optional connected</text><rect x="980" y="245" width="350" height="130" rx="24" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><rect x="997" y="268" width="5" height="77" rx="2" fill="#0A73E8"/><text x="1018" y="303" font-size="22" font-weight="700" fill="#102F56" >PROJECT CONTEXT</text><text x="1018" y="338" font-size="17" font-weight="400" fill="#5E7D9C" >User-selected sources</text><rect x="70" y="495" width="350" height="130" rx="24" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><rect x="87" y="518" width="5" height="77" rx="2" fill="#F27A28"/><text x="108" y="553" font-size="22" font-weight="700" fill="#102F56" >PROJECTGUARD</text><text x="108" y="588" font-size="17" font-weight="400" fill="#5E7D9C" >Review before protected changes</text><rect x="980" y="495" width="350" height="130" rx="24" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><rect x="997" y="518" width="5" height="77" rx="2" fill="#F27A28"/><text x="1018" y="553" font-size="22" font-weight="700" fill="#102F56" >EVIDENCE</text><text x="1018" y="588" font-size="17" font-weight="400" fill="#5E7D9C" >Visible results and activity</text><path d="M435 309 L520 335 M965 309 L882 335 M435 558 L527 455 M965 558 L874 455" stroke="#8ABBE9" stroke-width="3" fill="none" class="flow"/></svg>