"3" class="flow"/><rect x="809" y="245" width="230" height="178" rx="20" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><rect x="827.0" y="264" width="43" height="43" rx="13" fill="#F27A28" opacity=".12"/><text x="839.0" y="293" font-size="20" font-weight="700" fill="#F27A28" >4</text><text x="828.0" y="348" font-size="20" font-weight="700" fill="#102F56" >AUTHORIZE</text><text x="828.0" y="382" font-size="16" font-weight="400" fill="#55769A" >Explicit approval</text><path d="M1040.0 331 h16" stroke="#F27A28" stroke-width="3" class="flow"/><rect x="1057" y="245" width="230" height="178" rx="20" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><rect x="1075.0" y="264" width="43" height="43" rx="13" fill="#0A73E8" opacity=".12"/><text x="1087.0" y="293" font-size="20" font-weight="700" fill="#0A73E8" >5</text><text x="1076.0" y="348" font-size="20" font-weight="700" fill="#102F56" >EXECUTE</text><text x="1076.0" y="382" font-size="16" font-weight="400" fill="#55769A" >Supported effect</text><path d="M1288.0 331 h16" stroke="#F27A28" stroke-width="3" class="flow"/><rect x="1305" y="245" width="230" height="178" rx="20" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><rect x="1323.0" y="264" width="43" height="43" rx="13" fill="#0A73E8" opacity=".12"/><text x="1335.0" y="293" font-size="20" font-weight="700" fill="#0A73E8" >6</text><text x="1324.0" y="348" font-size="20" font-weight="700" fill="#102F56" >TRACE</text><text x="1324.0" y="382" font-size="16" font-weight="400" fill="#55769A" >Evidence record</text><path d="M65 481 H1535" stroke="#C2DBF5" stroke-width="3" stroke-linecap="round"/><path d="M65 481 H1535" stroke="#0A73E8" stroke-width="4" stroke-dasharray="30 65" opacity=".6" class="dash"/><text x="65" y="529" font-size="17" font-weight="700" fill="#0A73E8" >DESIGN PRINCIPLE</text><text x="270" y="529" font-size="19" font-weight="400" fill="#153C69" >A capability may propose; only authorized operations proceed.</text></svg>