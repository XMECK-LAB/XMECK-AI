<style>text{font-family:Arial,'DejaVu Sans',sans-serif} .navy{fill:#102F56}.muted{fill:#52749C}.blue{fill:#0A73E8}.orange{fill:#F27A28}.small{font-size:19px}.tiny{font-size:15px} .caps{letter-spacing:3px;font-weight:700;font-size:16px} .pulse{transform-origin:center;animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:center;animation:rotate 22s linear infinite}.dash{stroke-dasharray:8 16;animation:dash 20s linear infinite}.flow{stroke-dasharray:8 12;animation:dash 8s linear infinite}@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-320}}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.dash,.flow{animation:none!important}}</style>
