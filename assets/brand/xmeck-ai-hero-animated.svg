<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">XMECK-AI — Private-first Personal Intelligence Workspace</title>
<desc id="desc">Animated blue-orange XMECK-AI public product banner showing private local intelligence, projects, knowledge, connections, governed work and evidence.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop stop-color="#04101d"/>
    <stop offset=".52" stop-color="#0a1d3a"/>
    <stop offset="1" stop-color="#07111f"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop stop-color="#49caff"/>
    <stop offset=".49" stop-color="#147ce8"/>
    <stop offset=".51" stop-color="#ff9a31"/>
    <stop offset="1" stop-color="#ffc164"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop offset="0" stop-color="#1d6ec4" stop-opacity=".72"/>
    <stop offset=".55" stop-color="#0b1b38"/>
    <stop offset="1" stop-color="#020711"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="520" rx="28" fill="url(#bg)"/>
<g opacity=".13" stroke="#52c9ff">
  <path d="M0 86H1600M0 430H1600"/>
  <path d="M170 0V520M1430 0V520"/>
</g>

<g transform="translate(1260 255)">
  <circle r="127" fill="url(#orb)" stroke="#2f8fe9" stroke-width="2"/>
  <ellipse rx="188" ry="52" fill="none" stroke="#4dc9ff" stroke-width="2" opacity=".7">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse rx="168" ry="70" fill="none" stroke="#ff9d39" stroke-width="2" opacity=".72" transform="rotate(58)">
    <animateTransform attributeName="transform" type="rotate" from="58" to="418" dur="16s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M-64-74 L-15-22 L-65 34 L-40 60 L12 5 L65 60 L90 34 L38-20 L89-74 L62-97 L12-44 L-40-98 Z"
        fill="url(#accent)" filter="url(#glow)"/>
  <circle r="5" fill="#fff">
    <animate attributeName="r" values="4;8;4" dur="2.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".5;1;.5" dur="2.3s" repeatCount="indefinite"/>
  </circle>
</g>

<g font-family="Segoe UI,Arial,sans-serif">
  <text x="74" y="84" fill="#68d1ff" font-size="21" letter-spacing="5">XMECK-LAB · WINDOWS INTELLIGENCE WORKSPACE</text>
  <text x="74" y="182" fill="#fff" font-size="80" font-weight="760">XMECK-AI</text>
  <text x="76" y="236" fill="#dcecff" font-size="31">Private-first Personal Intelligence Workspace</text>
  <text x="76" y="290" fill="#a2bad8" font-size="23">Your intelligence. Local by default. Cloud by choice.</text>

  <text x="76" y="347" fill="#70ccff" font-size="19">CHAT · PROJECTS/GIT · KNOWLEDGE/RAG · INTELLIGENCE · CONNECTED · WORK · ACTIVITY/EVIDENCE</text>
  <text x="76" y="397" fill="#ffb15a" font-size="18" letter-spacing="1.6">PRODUCT TRUTH · EXPLICIT ROUTING · AUTHORITY BEFORE SIDE EFFECT · EVIDENCE BEFORE CLAIM</text>
  <text x="76" y="458" fill="#a7bfd9" font-size="16">QBOX-AI R1 → QBOX-AI R2 → XMECK-AI 1.0.0.0 · BY RAAJ MANDALE · PUBLISHED UNDER XMECK-LAB</text>
</g>
</svg>