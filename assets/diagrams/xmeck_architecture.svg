<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 670" width="1500" height="670" role="img"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".54" stop-color="#F5FAFF"/><stop offset="1" stop-color="#E8F4FF"/></linearGradient>
<linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A73E8"/><stop offset=".56" stop-color="#57C4F7"/><stop offset="1" stop-color="#F27A28"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white" stop-opacity=".97"/><stop offset="1" stop-color="#F1F8FF" stop-opacity=".91"/></linearGradient>
<filter id="shadow" x="-25%" y="-40%" width="160%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#2F689B" flood-opacity=".14"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="mesh" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#C8DBEE" stroke-width=".7" opacity=".5"/></pattern>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif} .navy{fill:#102F56}.muted{fill:#52749C}.blue{fill:#0A73E8}.orange{fill:#F27A28}.small{font-size:19px}.tiny{font-size:15px} .caps{letter-spacing:3px;font-weight:700;font-size:16px} .pulse{transform-origin:center;animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:center;animation:rotate 22s linear infinite}.dash{stroke-dasharray:8 16;animation:dash 20s linear infinite}.flow{stroke-dasharray:8 12;animation:dash 8s linear infinite}@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-320}}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.dash,.flow{animation:none!important}}</style>
</defs><rect width="1500" height="670" fill="url(#bg)"/><rect width="1500" height="670" fill="url(#mesh)" opacity=".45"/><text x="70" y="100" font-size="46" font-weight="700" fill="#102F56" >One workspace. Distinct responsibilities.</text><text x="70" y="146" font-size="22" font-weight="400" fill="#153C69" >A user-owned environment for local intelligence and controlled work.</text><rect x="70" y="215" width="412" height="173" rx="24" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><circle cx="122" cy="272" r="23" fill="#0A73E8" opacity=".13"/><text x="113" y="279" font-size="24" font-weight="700" fill="#0A73E8" >1</text><text x="160" y="273" font-size="24" font-weight="700" fill="#102F56" >EXPERIENCE</text><text x="100" y="331" font-size="19" font-weight="400" fill="#5C7A9A" >Chat / Work / Projects</text><rect x="525" y="215" width="412" height="173" rx="24" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><circle cx="577" cy="272" r="23" fill="#0A73E8" opacity=".13"/><text x="568" y="279" font-size="24" font-weight="700" fill="#0A73E8" >2</text><text x="615" y="273" font-size="24" font-weight="700" fill="#102F56" >INTELLIGENCE</text><text x="555" y="331" font-size="19" font-weight="400" fill="#5C7A9A" >Local + optional connected</text><rect x="980" y="215" width="412" height="173" rx="24" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><circle cx="1032" cy="272" r="23" fill="#0A73E8" opacity=".13"/><text x="1023" y="279" font-size="24" font-weight="700" fill="#0A73E8" >3</text><text x="1070" y="273" font-size="24" font-weight="700" fill="#102F56" >CONTEXT</text><text x="1010" y="331" font-size="19" font-weight="400" fill="#5C7A9A" >Knowledge + local Git</text><rect x="70" y="430" width="412" height="173" rx="24" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><circle cx="122" cy="487" r="23" fill="#F27A28" opacity=".13"/><text x="113" y="494" font-size="24" font-weight="700" fill="#F27A28" >4</text><text x="160" y="488" font-size="24" font-weight="700" fill="#102F56" >AUTHORITY</text><text x="100" y="546" font-size="19" font-weight="400" fill="#5C7A9A" >ProjectGuard</text><rect x="525" y="430" width="412" height="173" rx="24" fill="url(#glass)" stroke="#C9E0F7" stroke-width="1.7" filter="url(#shadow)"/><circle cx="577" cy="487" r="23" fill="#0A73E8" opacity=".13"/><text x="568" y="494" font-size="24" font-weight="700" fill="#0A73E8" >5</text><text x="615" y="488" font-size="24" font-weight="700" fill="#102F56" >EVIDENCE</text><text x="555" y="546" font-size="19" font-weight="400" fill="#5C7A9A" >Activity + recovery</text></svg>